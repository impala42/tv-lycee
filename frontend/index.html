<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affichage Lycée</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose:  #f4b8c1;
      --mint:  #b8e8d8;
      --lav:   #cfc4f0;
      --sky:   #b5d9f5;
      --white: #fdfcff;
      --ink:   #1a1628;
      --muted: #5a5470;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--white);
      font-family: 'Source Sans 3', sans-serif;
    }

    /* ── Fond dégradé pastel ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 10% 15%,  var(--lav)  0%, transparent 65%),
        radial-gradient(ellipse 55% 50% at 90% 80%,  var(--mint) 0%, transparent 60%),
        radial-gradient(ellipse 60% 55% at 82% 5%,   var(--sky)  0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 18% 92%,  var(--rose) 0%, transparent 55%),
        var(--white);
      animation: breathe 14s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      from { filter: hue-rotate(0deg)  brightness(1); }
      to   { filter: hue-rotate(10deg) brightness(1.03); }
    }

    /* ── Layout ── */
    .layout {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 4vh 5vw;
      gap: 3vh;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4vw;
      align-items: center;
      transition: opacity .6s ease;
      min-height: 0; /* empêche le débordement dans le flex parent */
    }

    /* Fondu lors du changement */
    .main.fading {
      opacity: 0;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3vh;
      padding: 2vh 0;
    }

    h1 {
      font-family: 'Lora', serif;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
    }

    .body-text {
      font-weight: 400;
      line-height: 1.6;
      color: var(--muted);
    }

    .visual {
      height: 70vh;
      display: flex;
      align-items: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow:
        0 4px 20px rgba(26,22,40,.08),
        0 20px 60px rgba(26,22,40,.12);
    }

    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Mode sans image ── */
    .main.no-image {
      grid-template-columns: 1fr;
    }

    .main.no-image .content {
      max-width: 80vw;
      margin: 0 auto;
      text-align: center;
    }

    /* ── Slide absences ── */
    .main.absences {
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    .absences-wrap {
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
      width: 100%;
    }

    .absences-title {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 2.6vw, 3.2rem);
      color: var(--ink);
      text-align: center;
      letter-spacing: .03em;
      margin-bottom: 1.2vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    .absences-title svg { flex-shrink: 0; }

    .absence-row {
      display: grid;
      grid-template-columns: 1.6fr 1.2fr 1.4fr;
      gap: 2vw;
      align-items: center;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(14px);
      border-radius: 1.2rem;
      padding: 1vh 2.5vw;
      box-shadow:
        0 2px 8px  rgba(26,22,40,.06),
        0 8px 32px rgba(26,22,40,.12);
      border-left: .7vw solid var(--lav);
    }

    .absence-prof {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 3.2vw, 4rem);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .absence-matiere {
      font-size: clamp(1.2rem, 2.7vw, 3.4rem);
      color: var(--muted);
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .absence-dates {
      display: flex;
      flex-direction: row;
      gap: .8vw;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .absence-date-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .absence-date-badge {
      font-size: clamp(1.1rem, 2.3vw, 3rem);
      font-weight: 600;
      color: var(--ink);
      background: rgba(207,196,240,0.35);
      border-radius: .5rem;
      padding: .15em .6em;
      line-height: 1.3;
      white-space: nowrap;
    }

    .absence-date-label {
      font-size: clamp(.6rem, .9vw, 1.1rem);
      font-weight: 400;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .15em;
    }

    /* ── Slide menu ── */
    .main.menu {
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    .menu-wrap {
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
      width: 100%;
    }

    .menu-title {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 2.6vw, 3.2rem);
      color: var(--ink);
      text-align: center;
      letter-spacing: .03em;
      margin-bottom: 1.2vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      text-transform: capitalize;
    }

    .menu-title svg { flex-shrink: 0; }

    .menu-date {
      font-size: clamp(1.4rem, 2.4vw, 3.2rem);
      color: var(--muted);
      font-weight: 400;
      text-align: center;
      margin-top: -.8vh;
      margin-bottom: .4vh;
      text-transform: capitalize;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 12vw 1fr auto;
      gap: 2vw;
      align-items: center;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(14px);
      border-radius: 1.2rem;
      padding: 1vh 2.5vw;
      box-shadow:
        0 2px 8px  rgba(26,22,40,.06),
        0 8px 32px rgba(26,22,40,.12);
    }



    .menu-categorie {
      font-size: clamp(.8rem, 1.2vw, 1.5rem);
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .menu-plat {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 3.6vw, 5rem);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-badges {
      display: flex;
      gap: .6vw;
      align-items: center;
      justify-content: flex-end;
    }

    .menu-badge img {
      width: clamp(1.4rem, 2.8vw, 3.6rem);
      height: clamp(1.4rem, 2.8vw, 3.6rem);
      object-fit: contain;
    }

    /* ── Footer ── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0; /* ne se compresse jamais */
    }

    .date-bottom, .clock {
      font-family: 'Lora', serif;
      font-size: clamp(1.2rem, 2.8vw, 2.6rem);
      font-weight: 600;
      color: var(--ink);
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="layout">

    <div class="main version-a" id="main">
      <!-- Contenu injecté par JS -->
    </div>

    <footer>
      <div class="date-bottom" id="date-bottom"></div>
      <div class="clock" id="clock"></div>
    </footer>

  </div>

  <script>
    const DURATION = 8000;
    const ABSENCES_PAR_SLIDE = 4;

    // token de la télé
    const token = window.location.search.slice(7);

    const main = document.getElementById('main');

    let annonces  = [];
    let absences  = [];
    let menus     = [];
    // slides = [...annonces_slides, ...absences_slides, ...menu_slides]
    // chaque élément : { type: 'annonce'|'absence'|'menu', data: ... }
    let slides = [];
    let index  = 0;

    /* ── Helpers date ── */
    function pad(n) { return String(n).padStart(2, '0'); }

    function fmtDate(str) {
      const d = new Date(str);
      return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    /* ── Construction du tableau de slides ── */
    function buildSlides() {
      slides = [];
      annonces.forEach(a => slides.push({ type: 'annonce', data: a }));
      for (let i = 0; i < absences.length; i += ABSENCES_PAR_SLIDE) {
        slides.push({ type: 'absence', data: absences.slice(i, i + ABSENCES_PAR_SLIDE) });
      }
      menus.forEach(m => slides.push({ type: 'menu', data: m }));
    }

    /* ── Rendu d'une slide menu ── */
    function renderMenu(m) {
      const categories = [
        { label: 'Entrée',  prefix: 'entree',  color: 'var(--mint)' },
        { label: 'Plat',    prefix: 'plat',    color: 'var(--rose)' },
        { label: 'Laitage', prefix: 'laitage', color: 'var(--lav)'  },
        { label: 'Dessert', prefix: 'dessert', color: 'var(--sky)'  },
      ];

      const dateStr = new Date(m.jour).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

      const rows = categories.map(cat => {
        const nom = m[cat.prefix + '_nom'] || '—';
        const badges = [
          { key: 'fait_maison',   img: 'img/fait_maison.png',   alt: 'Fait maison'   },
          { key: 'bio',           img: 'img/bio.png',           alt: 'Bio'           },
          { key: 'circuit_court', img: 'img/circuit_court.png', alt: 'Circuit court' },
          { key: 'sans_viande',   img: 'img/vegan.png',         alt: 'Sans viande'   },
        ]
        .filter(b => m[cat.prefix + '_' + b.key] == 1)
        .map(b => `<div class="menu-badge"><img src="${b.img}" alt="${b.alt}" title="${b.alt}" /></div>`)
        .join('');

        return `
        <div class="menu-row">
          <div class="menu-categorie">${cat.label}</div>
          <div class="menu-plat">${nom}</div>
          <div class="menu-badges">${badges}</div>
        </div>`;
      }).join('');

      main.innerHTML = `
        <div class="menu-wrap">
          <div class="menu-title">${dateStr}</div>
          ${rows}
        </div>`;
      main.className = 'main menu';
    }

    /* ── Rendu d'une slide annonce ── */
    function renderAnnonce(a, i) {
      const hasImage = a.lien_image && a.lien_image.trim() !== '';
      const textBlock = `
        <section class="content">
          <h1>${a.titre}</h1>
          <p class="body-text">${a.contenu}</p>
        </section>`;
      const imageBlock = `
        <div class="visual">
          <div class="card-img">
            <img src="${a.lien_image}" alt="${a.titre}" />
          </div>
        </div>`;

      if (!hasImage) {
        main.innerHTML = textBlock;
        main.className = 'main no-image';
      } else {
        main.innerHTML = (i % 2 === 0)
          ? textBlock + imageBlock
          : imageBlock + textBlock;
        main.className = 'main';
      }

      const tLen  = a.titre.length;
      const cLen  = a.contenu.length;
      const tRatio = 1 - Math.min(Math.max((tLen - 10) / 70, 0), 1);
      const tSize  = hasImage ? (3 + tRatio * 4).toFixed(2) : (4 + tRatio * 5).toFixed(2);
      const cRatio = 1 - Math.min(Math.max((cLen - 40) / 260, 0), 1);
      const cSize  = hasImage ? (1.4 + cRatio * 1.6).toFixed(2) : (1.8 + cRatio * 2).toFixed(2);
      main.querySelector('h1').style.fontSize         = `clamp(1.6rem, ${tSize}vw, 8rem)`;
      main.querySelector('.body-text').style.fontSize = `clamp(1rem, ${cSize}vw, 3.2rem)`;
    }

    /* ── Rendu d'une slide absences ── */
    function renderAbsences(group) {
      const colors = ['var(--lav)', 'var(--mint)', 'var(--rose)', 'var(--sky)'];
      const rows = group.map((ab, idx) => {
        const color = colors[idx % colors.length];
        return `
        <div class="absence-row" style="border-left-color:${color}">
          <div class="absence-prof">${ab.professeur}</div>
          <div class="absence-matiere">${ab.matiere}</div>
          <div class="absence-dates">
            <div class="absence-date-item">
              <div class="absence-date-label">Début</div>
              <div class="absence-date-badge">${fmtDate(ab.date_debut)}</div>
            </div>
            <div class="absence-date-item">
              <div class="absence-date-label">Fin</div>
              <div class="absence-date-badge">${fmtDate(ab.date_fin)}</div>
            </div>
          </div>
        </div>`;
      }).join('');

      main.innerHTML = `
        <div class="absences-wrap">
          <div class="absences-title">
            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              <line x1="17" y1="11" x2="23" y2="11"/>
            </svg>
            Absences des professeurs
          </div>
          ${rows}
        </div>`;
      main.className = 'main absences';
    }

    /* ── Rendu générique ── */
    function render(i) {
      const slide = slides[i];
      if (!slide) return;
      if (slide.type === 'annonce') renderAnnonce(slide.data, i);
      else if (slide.type === 'absence') renderAbsences(slide.data);
      else renderMenu(slide.data);
    }

    /* ── Défilement ── */
    function toggle() {
      main.classList.add('fading');
      setTimeout(() => {
        index++;
        if (index >= slides.length) {
          // On recharge tout avant de reboucler
          chargerTout().then(() => {
            index = 0;
            render(index);
            main.classList.remove('fading');
          });
          return;
        }
        render(index);
        main.classList.remove('fading');
      }, 600);
    }

    /* ── Chargements ── */
    function chargerInfos() {
      return fetch('infos.php?token=' + token)
        .then(res => res.json())
        .then(data => { annonces = data; })
        .catch(err => {
          console.error('Erreur chargement annonces', err);
          annonces = [];
        });
    }

    function chargerAbsences() {
      return fetch('absences.php?token=' + token)
        .then(res => res.json())
        .then(data => { absences = data; })
        .catch(err => {
          console.error('Erreur chargement absences', err);
          absences = [];
        });
    }

    function chargerMenus() {
      return fetch('menu.php?token=' + token)
        .then(res => res.json())
        .then(data => { menus = data; })
        .catch(err => {
          console.error('Erreur chargement menus', err);
          menus = [];
        });
    }

    function chargerTout() {
      return Promise.all([chargerInfos(), chargerAbsences(), chargerMenus()])
        .then(() => {
          buildSlides();
          if (slides.length === 0) {
            main.innerHTML = `<p style="color:var(--muted);font-size:2vw;grid-column:1/-1;text-align:center;">Aucune information à afficher.</p>`;
            return;
          }
          if (annonces.length > 0) document.title = annonces[0].nom || 'Affichage Lycée';
        })
        .catch(err => {
          main.innerHTML = `<p style="color:var(--muted);font-size:2vw;grid-column:1/-1;text-align:center;">Impossible de charger les données.</p>`;
          console.error('Erreur générale', err);
          setTimeout(() => location.reload(), 2000);
        });
    }

    let autoTimer;

    function resetTimer() {
      clearInterval(autoTimer);
      autoTimer = setInterval(toggle, DURATION);
    }

    chargerTout().then(() => {
      render(index);
      autoTimer = setInterval(toggle, DURATION);
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggle();
        resetTimer();
      }
    });

    // Horloge
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    }
    const opts = { weekday: 'long', day: 'numeric', month: 'long' };
    document.getElementById('date-bottom').textContent =
      new Date().toLocaleDateString('fr-FR', opts);
    tick();
    setInterval(tick, 1000);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affichage Lycée</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose:  #f4b8c1;
      --mint:  #b8e8d8;
      --lav:   #cfc4f0;
      --sky:   #b5d9f5;
      --white: #fdfcff;
      --ink:   #1a1628;
      --muted: #5a5470;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--white);
      font-family: 'Source Sans 3', sans-serif;
    }

    /* ── Fond dégradé pastel ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 10% 15%,  var(--lav)  0%, transparent 65%),
        radial-gradient(ellipse 55% 50% at 90% 80%,  var(--mint) 0%, transparent 60%),
        radial-gradient(ellipse 60% 55% at 82% 5%,   var(--sky)  0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 18% 92%,  var(--rose) 0%, transparent 55%),
        var(--white);
      animation: breathe 14s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      from { filter: hue-rotate(0deg)  brightness(1); }
      to   { filter: hue-rotate(10deg) brightness(1.03); }
    }

    /* ── Layout ── */
    .layout {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 4vh 5vw;
      gap: 3vh;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4vw;
      align-items: center;
      transition: opacity .6s ease;
      min-height: 0; /* empêche le débordement dans le flex parent */
    }

    /* Fondu lors du changement */
    .main.fading {
      opacity: 0;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3vh;
      padding: 2vh 0;
    }

    h1 {
      font-family: 'Lora', serif;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
    }

    .body-text {
      font-weight: 400;
      line-height: 1.6;
      color: var(--muted);
    }

    .visual {
      height: 70vh;
      display: flex;
      align-items: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow:
        0 4px 20px rgba(26,22,40,.08),
        0 20px 60px rgba(26,22,40,.12);
    }

    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Mode sans image ── */
    .main.no-image {
      grid-template-columns: 1fr;
    }

    .main.no-image .content {
      max-width: 80vw;
      margin: 0 auto;
      text-align: center;
    }

    /* ── Slide absences – timeline ── */
    .main.absences {
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    .absences-wrap {
      display: flex;
      flex-direction: column;
      gap: 1.8vh;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .absences-title {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 2.8vw, 3.6rem);
      color: var(--ink);
      text-align: center;
      letter-spacing: .03em;
      margin-bottom: .6vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    .absences-title svg { flex-shrink: 0; }

    /* Carte timeline */
    .absence-card {
      display: grid;
      grid-template-columns: 26vw 1fr;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(16px);
      border-radius: 1.6rem;
      overflow: hidden;
      box-shadow:
        0 2px 8px  rgba(26,22,40,.06),
        0 10px 40px rgba(26,22,40,.13);
    }

    /* Colonne gauche : timeline */
    .absence-timeline {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2vh 0;
      position: relative;
    }

    /* Trait vertical */
    .absence-timeline::before {
      content: '';
      position: absolute;
      top: 3.2vh;
      bottom: 3.2vh;
      left: 50%;
      transform: translateX(-50%);
      width: .45vw;
      border-radius: 99px;
      background: currentColor;
      opacity: .18;
    }

    .absence-tl-point {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5vh;
      z-index: 1;
    }

    .absence-tl-dot {
      width: clamp(1rem, 1.6vw, 2rem);
      height: clamp(1rem, 1.6vw, 2rem);
      border-radius: 50%;
      border: .35vw solid currentColor;
      background: var(--white);
      flex-shrink: 0;
    }

    .absence-tl-label {
      font-size: clamp(.65rem, .9vw, 1.1rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }

    .absence-tl-datetime {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: .6vw;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .absence-tl-date {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 2.6vw, 3.2rem);
      color: var(--ink);
      line-height: 1.2;
      white-space: nowrap;
    }

    .absence-tl-heure {
      font-size: clamp(1.2rem, 2.1vw, 2.8rem);
      font-weight: 600;
      color: var(--ink);
      background: rgba(207,196,240,0.4);
      border-radius: .5rem;
      padding: .1em .55em;
      line-height: 1.3;
      white-space: nowrap;
    }

    /* Colonne droite : infos prof */
    .absence-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.2vh 2.5vw;
      gap: .6vh;
      border-left: .6vw solid currentColor;
    }

    .absence-prof {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 3.8vw, 5rem);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    .absence-matiere {
      font-size: clamp(1.3rem, 2.6vw, 3.4rem);
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .absence-champ-libre {
      font-size: clamp(1rem, 1.9vw, 2.5rem);
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .85;
      font-style: italic;
    }

    /* ── Slide menu ── */
    .main.menu {
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    .menu-wrap {
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
      width: 100%;
    }

    .menu-title {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 3vw, 3.6rem);
      color: var(--ink);
      text-align: center;
      letter-spacing: .03em;
      margin-bottom: 1.2vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      text-transform: capitalize;
    }

    .menu-title svg { flex-shrink: 0; }

    .menu-date {
      font-size: clamp(1.4rem, 2.4vw, 3.2rem);
      color: var(--muted);
      font-weight: 400;
      text-align: center;
      margin-top: -.8vh;
      margin-bottom: .4vh;
      text-transform: capitalize;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 12vw 1fr auto;
      gap: 2vw;
      align-items: center;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(14px);
      border-radius: 1.2rem;
      padding: 1vh 2.5vw;
      box-shadow:
        0 2px 8px  rgba(26,22,40,.06),
        0 8px 32px rgba(26,22,40,.12);
    }



    .menu-categorie {
      font-size: clamp(.8rem, 1.2vw, 1.5rem);
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .menu-plat {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 3.6vw, 5rem);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-badges {
      display: flex;
      gap: .6vw;
      align-items: center;
      justify-content: flex-end;
    }

    .menu-badge img {
      width: clamp(1.4rem, 2.8vw, 3.6rem);
      height: clamp(1.4rem, 2.8vw, 3.6rem);
      object-fit: contain;
    }

    /* ── Mode image plein écran ── */
    #fullscreen-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
    }

    #fullscreen-overlay.active {
      display: block;
    }

    #fullscreen-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Footer ── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0; /* ne se compresse jamais */
    }

    .date-bottom, .clock {
      font-family: 'Lora', serif;
      font-size: clamp(1.2rem, 2.8vw, 2.6rem);
      font-weight: 600;
      color: var(--ink);
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div id="fullscreen-overlay">
    <img id="fullscreen-img" src="" alt="" />
  </div>

  <div class="layout">

    <div class="main version-a" id="main">
      <!-- Contenu injecté par JS -->
    </div>

    <footer>
      <div class="date-bottom" id="date-bottom"></div>
      <div class="clock" id="clock"></div>
    </footer>

  </div>

  <script>
    const DURATION_DEFAULT = 8000;
    const DURATION_ABSENCE = 5000;
    const ABSENCES_PAR_SLIDE = 2;

    // token de la télé
    const token = window.location.search.slice(7);

    const main = document.getElementById('main');

    let annonces  = [];
    let absences  = [];
    let menus     = [];
    // slides = [...annonces_slides, ...absences_slides, ...menu_slides]
    // chaque élément : { type: 'annonce'|'absence'|'menu', data: ... }
    let slides = [];
    let index  = 0;

    /* ── Helpers date ── */
    function pad(n) { return String(n).padStart(2, '0'); }

    function fmtDate(str) {
      const d = new Date(str);
      return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function fmtHeure(str) {
      const d = new Date(str);
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    /* ── Construction du tableau de slides ── */
    function buildSlides() {
      slides = [];
      annonces.forEach(a => slides.push({ type: 'annonce', data: a }));
      for (let i = 0; i < absences.length; i += ABSENCES_PAR_SLIDE) {
        slides.push({ type: 'absence', data: absences.slice(i, i + ABSENCES_PAR_SLIDE) });
      }
      menus.forEach(m => slides.push({ type: 'menu', data: m }));
    }

    /* ── Rendu d'une slide menu ── */
    function renderMenu(m) {
      const categories = [
        { label: 'Entrée',  prefix: 'entree',  color: 'var(--mint)' },
        { label: 'Plat',    prefix: 'plat',    color: 'var(--rose)' },
        { label: 'Laitage', prefix: 'laitage', color: 'var(--lav)'  },
        { label: 'Dessert', prefix: 'dessert', color: 'var(--sky)'  },
      ];

      const dateStr = new Date(m.jour).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

      const rows = categories.map(cat => {
        const nom = m[cat.prefix + '_nom'] || '—';
        const badges = [
          { key: 'fait_maison',   img: 'img/fait_maison.png',   alt: 'Fait maison'   },
          { key: 'bio',           img: 'img/bio.png',           alt: 'Bio'           },
          { key: 'circuit_court', img: 'img/circuit_court.png', alt: 'Circuit court' },
          { key: 'sans_viande',   img: 'img/vegan.png',         alt: 'Sans viande'   },
        ]
        .filter(b => m[cat.prefix + '_' + b.key] == 1)
        .map(b => `<div class="menu-badge"><img src="${b.img}" alt="${b.alt}" title="${b.alt}" /></div>`)
        .join('');

        return `
        <div class="menu-row">
          <div class="menu-categorie">${cat.label}</div>
          <div class="menu-plat">${nom}</div>
          <div class="menu-badges">${badges}</div>
        </div>`;
      }).join('');

      main.innerHTML = `
        <div class="menu-wrap">
          <div class="menu-title">${dateStr}</div>
          ${rows}
        </div>`;
      main.className = 'main menu';
    }

    const overlay    = document.getElementById('fullscreen-overlay');
    const fullscreenImg = document.getElementById('fullscreen-img');

    function showFullscreen(src, alt) {
      fullscreenImg.src = src;
      fullscreenImg.alt = alt;
      overlay.classList.add('active');
    }

    function hideFullscreen() {
      overlay.classList.remove('active');
      fullscreenImg.src = '';
    }

    /* ── Rendu d'une slide annonce ── */
    function renderAnnonce(a, i) {
      // Mode plein écran
      if (a.image_fullscreen == 1 && a.lien_image && a.lien_image.trim() !== '') {
        showFullscreen(a.lien_image, a.titre);
        main.innerHTML = '';
        main.className = 'main';
        return;
      }
      hideFullscreen();
      const hasImage = a.lien_image && a.lien_image.trim() !== '';
      const textBlock = `
        <section class="content">
          <h1>${a.titre}</h1>
          <p class="body-text">${a.contenu}</p>
        </section>`;
      const imageBlock = `
        <div class="visual">
          <div class="card-img">
            <img src="${a.lien_image}" alt="${a.titre}" />
          </div>
        </div>`;

      if (!hasImage) {
        main.innerHTML = textBlock;
        main.className = 'main no-image';
      } else {
        main.innerHTML = (i % 2 === 0)
          ? textBlock + imageBlock
          : imageBlock + textBlock;
        main.className = 'main';
      }

      const tLen  = a.titre.length;
      const cLen  = a.contenu.length;
      const tRatio = 1 - Math.min(Math.max((tLen - 10) / 70, 0), 1);
      const tSize  = hasImage ? (3 + tRatio * 4).toFixed(2) : (4 + tRatio * 5).toFixed(2);
      const cRatio = 1 - Math.min(Math.max((cLen - 40) / 260, 0), 1);
      const cSize  = hasImage ? (1.4 + cRatio * 1.6).toFixed(2) : (1.8 + cRatio * 2).toFixed(2);
      main.querySelector('h1').style.fontSize         = `clamp(1.6rem, ${tSize}vw, 8rem)`;
      main.querySelector('.body-text').style.fontSize = `clamp(1rem, ${cSize}vw, 3.2rem)`;
    }

    /* ── Rendu d'une slide absences – timeline ── */
    function renderAbsences(group) {
      const colors = [
        { line: 'var(--lav)',  rgb: '207,196,240' },
        { line: 'var(--mint)', rgb: '184,232,216' },
        { line: 'var(--rose)', rgb: '244,184,193' },
        { line: 'var(--sky)',  rgb: '181,217,245' },
      ];

      const cards = group.map((ab, idx) => {
        const c = colors[idx % colors.length];

        const dDebut = new Date(ab.date_debut);
        const dFin   = new Date(ab.date_fin);
        const touteJournee =
          dDebut.getHours() === 0  && dDebut.getMinutes() === 0 &&
          dFin.getHours()   === 23 && dFin.getMinutes()   === 59;

        const heureDebutHtml = touteJournee ? '' :
          `<div class="absence-tl-heure">${fmtHeure(ab.date_debut)}</div>`;
        const heureFinHtml = touteJournee ? '' :
          `<div class="absence-tl-heure">${fmtHeure(ab.date_fin)}</div>`;

        const champLibre = ab.champ_libre && ab.champ_libre.trim() !== ''
          ? `<div class="absence-champ-libre">↳ ${ab.champ_libre}</div>`
          : '';

        return `
        <div class="absence-card" style="color:${c.line}">
          <div class="absence-timeline">
            <div class="absence-tl-point">
              <div class="absence-tl-label">Début</div>
              <div class="absence-tl-dot"></div>
              <div class="absence-tl-datetime">
                <div class="absence-tl-date">${fmtDate(ab.date_debut)}</div>
                ${heureDebutHtml}
              </div>
            </div>
            <div class="absence-tl-point">
              <div class="absence-tl-datetime">
                <div class="absence-tl-date">${fmtDate(ab.date_fin)}</div>
                ${heureFinHtml}
              </div>
              <div class="absence-tl-dot"></div>
              <div class="absence-tl-label">Fin</div>
            </div>
          </div>
          <div class="absence-info" style="border-left-color:${c.line}; background: rgba(${c.rgb},.13)">
            <div class="absence-prof">${ab.professeur}</div>
            <div class="absence-matiere">${ab.matiere}</div>
            ${champLibre}
          </div>
        </div>`;
      }).join('');

      main.innerHTML = `
        <div class="absences-wrap">
          <div class="absences-title">
            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              <line x1="17" y1="11" x2="23" y2="11"/>
            </svg>
            Absences des professeurs
          </div>
          ${cards}
        </div>`;
      main.className = 'main absences';
    }

    /* ── Rendu générique ── */
    function render(i) {
      const slide = slides[i];
      if (!slide) return;
      if (slide.type !== 'annonce') hideFullscreen();
      if (slide.type === 'annonce') renderAnnonce(slide.data, i);
      else if (slide.type === 'absence') renderAbsences(slide.data);
      else renderMenu(slide.data);
    }

    /* ── Défilement ── */
    function toggle() {
      main.classList.add('fading');
      setTimeout(() => {
        index++;
        if (index >= slides.length) {
          // On recharge tout avant de reboucler
          chargerTout().then(() => {
            index = 0;
            render(index);
            main.classList.remove('fading');
            scheduleNext();
          });
          return;
        }
        render(index);
        main.classList.remove('fading');
        scheduleNext();
      }, 600);
    }

    /* ── Chargements ── */
    function chargerInfos() {
      return fetch('infos.php?token=' + token)
        .then(res => res.json())
        .then(data => { annonces = data; })
        .catch(err => {
          console.error('Erreur chargement annonces', err);
          annonces = [];
        });
    }

    function chargerAbsences() {
      return fetch('absences.php?token=' + token)
        .then(res => res.json())
        .then(data => { absences = data; })
        .catch(err => {
          console.error('Erreur chargement absences', err);
          absences = [];
        });
    }

    function chargerMenus() {
      return fetch('menu.php?token=' + token)
        .then(res => res.json())
        .then(data => { menus = data; })
        .catch(err => {
          console.error('Erreur chargement menus', err);
          menus = [];
        });
    }

    function chargerTout() {
      return Promise.all([chargerInfos(), chargerAbsences(), chargerMenus()])
        .then(() => {
          buildSlides();
          if (slides.length === 0) {
            main.innerHTML = `<p style="color:var(--muted);font-size:2vw;grid-column:1/-1;text-align:center;">Aucune information à afficher.</p>`;
            return;
          }
          if (annonces.length > 0) document.title = annonces[0].nom || 'Affichage Lycée';
        })
        .catch(err => {
          main.innerHTML = `<p style="color:var(--muted);font-size:2vw;grid-column:1/-1;text-align:center;">Impossible de charger les données.</p>`;
          console.error('Erreur générale', err);
          setTimeout(() => location.reload(), 2000);
        });
    }

    function getDuration(slide) {
      if (!slide) return DURATION_DEFAULT;
      return slide.type === 'absence' ? DURATION_ABSENCE : DURATION_DEFAULT;
    }

    let autoTimer;

    function scheduleNext() {
      clearTimeout(autoTimer);
      const duration = getDuration(slides[index]);
      autoTimer = setTimeout(() => {
        toggle();
      }, duration);
    }

    chargerTout().then(() => {
      render(index);
      scheduleNext();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggle();
        scheduleNext();
      }
    });

    // Horloge
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    }
    const opts = { weekday: 'long', day: 'numeric', month: 'long' };
    document.getElementById('date-bottom').textContent =
      new Date().toLocaleDateString('fr-FR', opts);
    tick();
    setInterval(tick, 1000);
  </script>

</body>
</html>
